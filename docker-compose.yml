services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devdocs}
      POSTGRES_DB: ${POSTGRES_DB:-devdocs}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Exposed on loopback only, for a backend running outside Docker (./start.sh).
    # Set POSTGRES_PORT if port 5432 is already in use on the host.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    # networks:
    #   - dokploy-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-devdocs}:${POSTGRES_PASSWORD:-devdocs}@postgres:5432/${POSTGRES_DB:-devdocs}
      OPENAI_API_KEYS: ${OPENAI_API_KEYS:?error}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen/qwen3-32b}
      AGENTOPS_API_KEY: ${AGENTOPS_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?error}
      JWT_EXPIRE_IN_MINUTES: ${JWT_EXPIRE_IN_MINUTES:-15}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ALLOW_ORIGINS: ${ALLOW_ORIGINS:-*}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      VOICE_AGENT_NAME: ${VOICE_AGENT_NAME:-devdocs-voice}
    volumes:
      - user_docs:/app/docs/uploads
    # networks:
    #   - dokploy-network

  # LiveKit Agents worker: joins a room, talks to Deepgram, and answers from
  # the same user_docs volume the API writes uploads to.
  voice-agent:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Exits 0 when voice is not configured; only restart real failures.
    restart: on-failure
    command: ["uv", "run", "python", "-m", "voice.agent", "start"]
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-devdocs}:${POSTGRES_PASSWORD:-devdocs}@postgres:5432/${POSTGRES_DB:-devdocs}
      OPENAI_API_KEYS: ${OPENAI_API_KEYS:?error}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen/qwen3-32b}
      AGENTOPS_API_KEY: ${AGENTOPS_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?error}
      JWT_EXPIRE_IN_MINUTES: ${JWT_EXPIRE_IN_MINUTES:-15}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ALLOW_ORIGINS: ${ALLOW_ORIGINS:-*}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      VOICE_AGENT_NAME: ${VOICE_AGENT_NAME:-devdocs-voice}
      VOICE_LLM_MODEL: ${VOICE_LLM_MODEL:-google/gemma-4-31b-it}
      VOICE_STT_MODEL: ${VOICE_STT_MODEL:-flux-general-en}
      VOICE_TTS_MODEL: ${VOICE_TTS_MODEL:-aura-2-thalia-en}
      VOICE_KEYTERMS: ${VOICE_KEYTERMS:-DevDocs,Agno,FastAPI,PostgreSQL,LiveKit,Deepgram}
    volumes:
      - user_docs:/app/docs/uploads
    # networks:
    #   - dokploy-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_MOCK_MODE: "false"
    restart: unless-stopped
    ports:
      - "3000"
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
    # networks:
    #   - dokploy-network

volumes:
  postgres_data:
  user_docs:

networks:
  dokploy-network:
    external: true
