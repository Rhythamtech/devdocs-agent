
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-devdocs}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  devdocsbackend:
    image: img-devdocs-backend:latest
    pull_policy: build
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment: &backend-env
      POSTGRES_URL: ${COMPOSE_POSTGRES_URL:-postgresql://${POSTGRES_USER:-devdocs}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-devdocs}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen/qwen3-32b}
      AGENTOPS_API_KEY: ${AGENTOPS_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRE_IN_MINUTES: ${JWT_EXPIRE_IN_MINUTES:-15}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ALLOW_ORIGINS: ${ALLOW_ORIGINS:-*}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      VOICE_AGENT_NAME: ${VOICE_AGENT_NAME:-devdocs-voice}
    volumes:
      - user_docs:/app/docs/uploads

  devdocsvoice-agent:
    image: img-devdocs-backend:latest
    pull_policy: build
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: on-failure
    init: true
    command: ["uv", "run", "python", "-m", "voice.agent", "start"]
    depends_on:
      postgres:
        condition: service_healthy
      devdocsbackend:
        condition: service_started
    environment:
      <<: *backend-env
      VOICE_LLM_MODEL: ${VOICE_LLM_MODEL:-google/gemma-4-31b-it}
      VOICE_STT_MODEL: ${VOICE_STT_MODEL:-flux-general-en}
      VOICE_TTS_MODEL: ${VOICE_TTS_MODEL:-aura-2-thalia-en}
      VOICE_KEYTERMS: ${VOICE_KEYTERMS:-DevDocs,Agno,FastAPI,PostgreSQL,LiveKit,Deepgram}
    volumes:
      - user_docs:/app/docs/uploads

  devdocsfrontend:
    image: img-devdocs-frontend:latest
    pull_policy: build
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_MOCK_MODE: "false"
        BACKEND_INTERNAL_URL: http://devdocsbackend:8000
    restart: unless-stopped
    init: true
    environment:
      API_URL: http://devdocsbackend:8000
    expose:
      - "3000"
    depends_on:
      - devdocsbackend

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://devdocsfrontend:3000
    depends_on:
      - devdocsfrontend

volumes:
  postgres_data:
  user_docs:
